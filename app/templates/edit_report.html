{% extends "base.html" %}

{% block title %}
    {{ title }}
{% endblock %}


{% block head %}    
    <!-- include libraries(jQuery, bootstrap) -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote.min.css" rel="stylesheet">
    
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h3 class="display-6 fw-bold text-primary mb-1">
                    <i class="bi bi-pencil-square"></i> {{ title }}
                </h3>
                <p class="text-muted mb-0">Editing: {{ report_filename }}</p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary"
                   href="{{ url_for('main.view_report', id=report_id) }}">
                    <i class="bi bi-eye"></i> View
                </a>
                <a class="btn btn-outline-primary"
                   href="{{ url_for('main.download_report', id=report_id) }}">
                    <i class="bi bi-download"></i> Download
                </a>
            </div>
        </div>
    </div>

    <div class="row" id="summernote">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('main.edit_report', id=report_id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <textarea id="editor" name="edited_content">
{{ editable_content|safe }}
                        </textarea>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{{ url_for('main.view_report', id=report_id) }}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>



{% block scripts %}
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote.min.js"></script>

<script>
    $(document).ready(function() {
        $('#summernote').summernote();
    });
</script>

{% endblock %}


{% endblock %}
